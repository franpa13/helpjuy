<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>HelpJuy — Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@800&display=block" rel="stylesheet">
<style>
:root{--red:#C8102E;--ink:#141414;--paper:#F7F5F0;--line:#D9D6CE}*{box-sizing:border-box;margin:0}
body{font-family:"Atkinson Hyperlegible",sans-serif;background:#e9e6df;color:var(--ink);padding:32px;width:1400px}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.tile{min-height:300px;display:flex;align-items:center;justify-content:center;position:relative}
.tile small{position:absolute;left:16px;bottom:12px;font-size:13px;opacity:.7}.red{background:var(--red);color:#fff}.paper{background:var(--paper);border:1px solid var(--line)}.ink{background:var(--ink);color:#fff}
.lock{display:inline-flex;align-items:center;gap:30px}.word{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:96px;line-height:1;text-transform:uppercase;letter-spacing:.02em;transform:translateY(4px)}
.row{display:flex;gap:40px;align-items:end}.cap{font-size:13px;text-align:center;margin-top:8px;opacity:.7}.wide{grid-column:1/-1}
.card{width:340px;height:214px;background:#fff;border:3px solid var(--ink);border-radius:10px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.card .h{background:var(--red);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.06em}
.card .b{display:flex;align-items:center;justify-content:center;color:#6b6b6b;font-size:14px}
</style></head><body><div class="grid">
